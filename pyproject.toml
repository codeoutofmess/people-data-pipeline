[project]
name = "people-data-pipeline"
version = "0.1.0"
description = "Learning project: a tested pipeline and small API over synthetic people data."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "uvicorn>=0.32",
]

[project.scripts]
people = "people.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["people"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)` in argument defaults is intended usage, not a bug.
extend-immutable-calls = ["fastapi.Depends"]
